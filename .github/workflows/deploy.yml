name: Deploy to Hetzner

# Builds the game-server image, pushes it to GHCR, then SSHes into the
# Hetzner box to pull and restart the container.
#
# Required repository secrets:
#   HETZNER_HOST        server IP or hostname
#   HETZNER_USER        SSH user (needs docker access)
#   HETZNER_SSH_KEY     private key for that user
#   ANTHROPIC_API_KEY   the Claude API key the DM uses
#   FQ_HOST_KEY         family passcode the host app must present

on:
  push:
    branches: [claude/family-dnd-game-gew4a2]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bbolek/couplednd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/bbolek/couplednd:${{ github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FQ_HOST_KEY: ${{ secrets.FQ_HOST_KEY }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF,ANTHROPIC_API_KEY,FQ_HOST_KEY
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"
            docker rm -f familyquest 2>/dev/null || true
            docker run -d --name familyquest --restart unless-stopped \
              -p 80:8787 \
              -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
              -e FQ_HOST_KEY="$FQ_HOST_KEY" \
              "$IMAGE_REF"
            docker image prune -f
            sleep 2
            wget -qO- http://127.0.0.1/health
